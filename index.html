
<!DOCTYPE html>
<html>
	<head>
		<title>Welcome!</title>
		<meta charset="UTF-8">
		<link href="./style.css" rel="stylesheet"/>
	</head>
	<body>
		<h1>Meowo~ฅ^>⩊<^ ฅ</h1>
		<ul id="links"></ul>
		<script>
			fetch("links.json")
			.then(r => r.json())
			.then(links => {
			document.getElementById("links").innerHTML = links.map(l => `
			<li>
				<a href="${l.url}">
					<img src="${l.icon}"></a>
				<a class="underlink" href="${l.url}">${l.name}</a>
			</li>`).join("");
			});	
			</script>

		<img class="corner-image" src="https://raw.githubusercontent.com/MultiMC/Launcher/refs/heads/develop/launcher/resources/backgrounds/catbgrnd2.png" alt="">
	</body>
</html>
